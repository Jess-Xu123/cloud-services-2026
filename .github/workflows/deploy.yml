name: Build and Deploy Frontend to Rahti

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./week-6
          file: ./week-6/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/todo-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/todo-frontend:latest

      - name: Install OpenShift CLI (oc)
        uses: redhat-actions/openshift-tools-installer@v3
        with:
          oc: "4.15"
          skip_cache: true

      - name: Deploy Frontend to Rahti
        run: |
          oc login --token=${{ secrets.RAHTI_TOKEN }} --server=${{ secrets.RAHTI_SERVER }}
          oc project week6-assignment
          echo "Deploying image to week6-assignment: ${{ secrets.DOCKER_USERNAME }}/todo-frontend:${{ github.sha }}"
          oc set image deployment/frontend-deployment frontend=${{ secrets.DOCKER_USERNAME }}/todo-frontend:${{ github.sha }}
          oc rollout status deployment/frontend-deployment --timeout=180s
