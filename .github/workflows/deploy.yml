name: Build and Deploy Frontend to Rahti

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./week-6
          file: ./week-6/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/todo-frontend:${{ github.sha }}

      - name: Install OpenShift CLI (oc)
        uses: redhat-actions/oc-installer@v1
        with:
          oc_version: "4.12"

      - name: Deploy Frontend to Rahti
        run: |
          oc login --token=${{ secrets.RAHTI_TOKEN }} --server=${{ secrets.RAHTI_SERVER }}
          oc set image deployment/frontend-deployment frontend=${{ secrets.DOCKER_USERNAME }}/todo-frontend:${{ github.sha }}
          oc rollout status deployment/frontend-deployment --timeout=180s
